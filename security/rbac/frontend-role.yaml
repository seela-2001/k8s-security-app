apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: 
  name: frontend-reader
  namespace: security-app
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
